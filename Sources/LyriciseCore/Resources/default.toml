# Lyricise — changes are applied while the app is running.
[window]
toggle_hotkey = "" # Unset. Example: "cmd+shift+l"
width = 420
height = 300
always_on_top = true
all_spaces = true
remember_position = true

[appearance]
background = "#1e1e2e"
background_opacity = 0.75
blur = 0
accent = "#b4befe"
text = "#cdd6f4"
muted_text = "#6c7086"
font = "SF Pro"
font_size = 20
padding = 16
corner_radius = 12
border_color = "#b4befe"
border_width = 0 # 0 hides the border; 0–12 pt

[lyrics]
# never, hover, or always
show_track_title = "always"
show_album_art = "never"
follow_playback = true
offset_ms = 0
